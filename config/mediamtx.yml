###############################################
# MediaMTX – Raspberry Pi 5 RTSP Stream
# Low-latency, on-demand camera streaming
###############################################

# Logging
logLevel: info
logDestinations: [stdout]

# RTSP server
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

# Lower write queue for reduced latency
writeQueueSize: 256

# Disable unused protocols
rtmp: false
hls: false
webrtc: false
srt: false

###############################################
# Camera path
###############################################
paths:
  cam:
    source: rpiCamera

    # --- Resolution & framerate ---
    rpiCameraWidth: 1920
    rpiCameraHeight: 1080
    rpiCameraFPS: 30

    # --- Codec (Pi 5 has no HW encoder, uses software H.264) ---
    rpiCameraCodec: auto
    rpiCameraBitrate: 4000000
    rpiCameraIDRPeriod: 30
    rpiCameraSoftwareH264Profile: baseline
    rpiCameraSoftwareH264Level: "4.1"

    # --- Performance ---
    rpiCameraDenoise: "off"

    # --- On-demand: camera activates only when a client connects ---
    sourceOnDemand: true
    sourceOnDemandStartTimeout: 10s
    sourceOnDemandCloseAfter: 10s
